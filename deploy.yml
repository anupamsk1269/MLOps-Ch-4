name: Kaizen SageMaker Ingest

on:
  push:
    branches: [ main ]

permissions:
  id-token: write # Required for requesting the JWT
  contents: read  # Required for actions/checkout

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::372362723027:role/GitHubSageMakerRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: roberta-service
          IMAGE_TAG: v2-final
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Launch SageMaker Processing Job
        run: |
          JOB_NAME="kaizen-auto-$(date +%s)"
          aws sagemaker create-processing-job \
            --no-cli-pager \
            --processing-job-name "$JOB_NAME" \
            --role-arn arn:aws:iam::372362723027:role/AmazonSageMaker-ExecutionRole-1969 \
            --app-specification "{\"ImageUri\":\"372362723027.dkr.ecr.us-east-1.amazonaws.com/roberta-service:v2-final\",\"ContainerEntrypoint\":[\"python3\",\"/app/app/ingest.py\"]}" \
            --processing-resources "{\"ClusterConfig\":{\"InstanceCount\":1,\"InstanceType\":\"ml.t3.medium\",\"VolumeSizeInGB\":5}}" \
            --processing-inputs "[{\"InputName\":\"input-data\",\"S3Input\":{\"S3Uri\":\"s3://sagemaker-us-east-1-372362723027/raw_data.csv\",\"LocalPath\":\"/opt/ml/processing/input\",\"S3DataType\":\"S3Prefix\",\"S3InputMode\":\"File\"}}]"